# Baut "MPC Mapper.app" für macOS (Apple Silicon + Intel) auf GitHub-Servern.
#
# Ergebnis herunterladen: Reiter "Actions" → letzter Lauf → unten "Artifacts".
# Wird ein Tag wie "v1.0" gepusht, landen die ZIPs zusätzlich unter "Releases".

name: macOS-App bauen

on:
  workflow_dispatch:          # Button "Run workflow" im Reiter Actions
  push:
    branches: [main, mac-app, release]   # Push auf "release" = neues Release
    tags: ["v*"]

permissions:
  contents: write             # nötig, um ZIPs an ein Release zu hängen

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest       # Apple Silicon (M1/M2/M3/M4)
            arch: apple-silicon
          - runner: macos-15-intel     # ältere Macs mit Intel-Prozessor
            arch: intel
    runs-on: ${{ matrix.runner }}
    name: Build (${{ matrix.arch }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.0"

      - name: App bauen
        run: |
          # Startdatei für die App anlegen, falls sie im Repository fehlt
          if [ ! -f mac/launcher.py ]; then
            mkdir -p mac
            printf '%s\n' \
              'import sys' \
              'from mpc_mapper.__main__ import main' \
              'if __name__ == "__main__":' \
              '    sys.exit(main())' > mac/launcher.py
          fi
          pyinstaller \
            --noconfirm --clean --log-level WARN \
            --windowed \
            --name "MPC Mapper" \
            --osx-bundle-identifier "com.mpcmapper.app" \
            --paths "$GITHUB_WORKSPACE" \
            --hidden-import mido.backends.rtmidi \
            --hidden-import rtmidi \
            --add-data "ma3_plugin:ma3_plugin" \
            --add-data "mappings:mappings" \
            mac/launcher.py

      - name: Prüfen, ob die App startfähig ist
        run: |
          test -x "dist/MPC Mapper.app/Contents/MacOS/MPC Mapper"
          # MIDI-Treiber muss mit eingepackt sein, sonst findet die App den APC nicht
          find "dist/MPC Mapper.app" -name "*rtmidi*" | grep -q . || { echo "rtmidi fehlt im Bundle"; exit 1; }
          codesign --verify --deep "dist/MPC Mapper.app"

      - name: Screenshots aufnehmen
        if: matrix.arch == 'apple-silicon'
        continue-on-error: true
        run: |
          mkdir -p shots
          # 1) Das komplette Fenster in voller Größe (direkt aus Qt gerendert)
          python - <<'EOF'
          import sys
          from PySide6.QtCore import QTimer
          from PySide6.QtWidgets import QApplication
          from mpc_mapper.gui.main_window import MainWindow
          app = QApplication(sys.argv)
          app.setApplicationName("MPC Mapper")
          app.setStyle("Fusion")
          w = MainWindow(); w.resize(1450, 950); w.show()
          def shoot():
              w.grab().save("shots/fenster.png")
              w.tabs.setCurrentIndex(w.tabs.indexOf(w.lab))
              app.processEvents()
              w.grab().save("shots/led-lab.png")
              app.quit()
          QTimer.singleShot(4000, shoot)
          app.exec()
          EOF
          # 2) Die gebaute App, wie sie auf dem Mac-Bildschirm erscheint
          open "dist/MPC Mapper.app"
          sleep 20
          screencapture -x shots/bildschirm.png || true
          pkill -f "MPC Mapper.app" || true
          ls -la shots

      - name: Screenshots in den Zweig "screenshots" legen
        if: matrix.arch == 'apple-silicon'
        continue-on-error: true
        run: |
          cd shots
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots vom Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots

      - name: Pakete zusammenstellen
        run: |
          # --- Plugin fürs Pult: Ordnerstruktur wie auf dem USB-Stick erwartet ---
          P="out/grandMA3-Plugin"
          mkdir -p "$P/gma3_library/datapools/plugins"
          cp ma3_plugin/APC_Feedback.xml ma3_plugin/APC_Feedback.lua "$P/gma3_library/datapools/plugins/"
          cat > "$P/LIESMICH.txt" <<'EOF'
          grandMA3-Plugin für MPC Mapper
          ==============================

          1. Den Ordner "gma3_library" aus diesem Ordner auf einen USB-Stick kopieren
             (direkt ins Hauptverzeichnis des Sticks).
             Bei grandMA3 onPC: die beiden Dateien aus gma3_library/datapools/plugins
             in den gleichnamigen Ordner im onPC-Datenordner kopieren.
          2. Stick ans Pult stecken.
          3. Plugins-Pool öffnen -> leeres Feld -> Import -> "APC_Feedback" wählen.
          4. Plugin einmal ausführen = starten (nochmal ausführen = stoppen).

          OSC-Einstellungen am Pult (Menu -> In & Out -> OSC, Enable Input + Output):
            Line 1: Destination IP = Mac, Port 8000, Prefix gma3,
                    Receive = Yes, Receive Command = Yes
            Line 2: Destination IP = Mac, Port 8001,
                    Send = Yes, Send Command = Yes, Receive aus
          Ist die Rückmeldung nicht Line 2: in APC_Feedback.lua oben OSC_LINE ändern.

          Ausführliche Anleitung: Anleitung.html
          EOF
          cp mac/Anleitung.html out/Anleitung.html
          cp mappings/demo.json out/Demo-Layout.json
          # ditto erhält Symlinks und Rechte im .app-Paket (normales zip zerstört sie)
          ditto "dist/MPC Mapper.app" "out/MPC Mapper.app"
          mv out "MPC Mapper"
          ditto -c -k --keepParent "MPC Mapper" "MPC-Mapper-macOS-${{ matrix.arch }}.zip"
          # Plugin zusätzlich als eigene ZIP (für den USB-Stick)
          ditto -c -k --keepParent "MPC Mapper/grandMA3-Plugin" grandMA3-Plugin.zip
          cp "MPC Mapper/Anleitung.html" Anleitung.html
          cp "MPC Mapper/Demo-Layout.json" Demo-Layout.json

      - uses: actions/upload-artifact@v4
        with:
          name: MPC-Mapper-macOS-${{ matrix.arch }}
          path: MPC-Mapper-macOS-${{ matrix.arch }}.zip

      - name: Release erstellen (bei Tag v* oder Push auf Zweig "release")
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release'
        env:
          GH_TOKEN: ${{ github.token }}
          # Versionsnummer für Pushes auf den Zweig "release" – hier hochzählen
          RELEASE_VERSION: v1.0
        run: |
          cat > notes.md <<'EOF'
          ## MPC Mapper für macOS

          Steuert grandMA3 mit einem Akai APC mini mk2, inklusive LED-Rückmeldung.

          ### Downloads
          | Datei | Wofür |
          | --- | --- |
          | **MPC-Mapper-macOS-apple-silicon.zip** | Komplettpaket für Macs mit M1, M2, M3 oder M4 |
          | **MPC-Mapper-macOS-intel.zip** | Komplettpaket für ältere Macs mit Intel-Prozessor |
          | grandMA3-Plugin.zip | Nur das Plugin fürs Pult (steckt auch im Komplettpaket) |
          | Anleitung.html | Ausführliche Anleitung auf Deutsch (steckt auch im Komplettpaket) |
          | Demo-Layout.json | Beispiel-Belegung (steckt auch im Komplettpaket) |

          Du brauchst nur **ein Komplettpaket** – darin ist alles: die App, das Plugin, die Anleitung und das Demo-Layout.
          Welchen Mac du hast, steht unter  → „Über diesen Mac“ bei „Chip“ bzw. „Prozessor“.

          ### In 5 Schritten
          1. Komplettpaket herunterladen und doppelklicken.
          2. `MPC Mapper.app` in den Ordner **Programme** ziehen.
          3. App starten. macOS blockiert sie beim ersten Mal, weil sie nicht von Apple signiert ist:
             **Systemeinstellungen → Datenschutz & Sicherheit** → ganz unten **„Dennoch öffnen“**.
             Fragt macOS nach eingehenden Netzwerkverbindungen: **Erlauben**.
          4. Pult einrichten: Ordner `gma3_library` aus `grandMA3-Plugin` auf einen USB-Stick kopieren, Plugin importieren und starten, zwei OSC-Lines anlegen (siehe `LIESMICH.txt` bzw. `Anleitung.html`).
          5. In der App die IP des Pults eintragen und **Connect MA3** klicken.

          Original-Projekt: https://github.com/miles-p/MPC_Mapper
          EOF
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="$RELEASE_VERSION"; fi
          # Beide Builds laufen parallel – wer zuerst kommt, legt das Release an
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --target "$GITHUB_SHA" --title "MPC Mapper $TAG für macOS" --notes-file notes.md \
            || sleep 10
          gh release edit "$TAG" --notes-file notes.md
          gh release upload "$TAG" "MPC-Mapper-macOS-${{ matrix.arch }}.zip" --clobber
          if [ "${{ matrix.arch }}" = "apple-silicon" ]; then
            gh release upload "$TAG" grandMA3-Plugin.zip Anleitung.html Demo-Layout.json --clobber
          fi
