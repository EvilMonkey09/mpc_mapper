# Baut MPC Mapper für macOS (Apple Silicon + Intel) und Windows 10/11 auf GitHub-Servern.
#
# Ergebnis herunterladen: Reiter "Actions" → letzter Lauf → unten "Artifacts".
# Ein Push auf den Zweig "release" (oder ein Tag "v*") erstellt bzw. aktualisiert
# zusätzlich das Release mit allen Dateien.

name: App bauen (macOS + Windows)

on:
  workflow_dispatch:          # Button "Run workflow" im Reiter Actions
  push:
    branches: [main, mac-app, release]   # Push auf "release" = Release aktualisieren
    tags: ["v*"]

permissions:
  contents: write             # nötig für Releases und den Screenshot-Zweig

env:
  # Versionsnummer für Pushes auf den Zweig "release" – hier hochzählen
  RELEASE_VERSION: v1.0
  PYTHON_VERSION: "3.12"

defaults:
  run:
    shell: bash

jobs:
  # ------------------------------------------------------------------------- #
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest       # Apple Silicon (M1/M2/M3/M4)
            arch: apple-silicon
          - runner: macos-15-intel     # ältere Macs mit Intel-Prozessor
            arch: intel
    runs-on: ${{ matrix.runner }}
    name: macOS (${{ matrix.arch }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.0"

      - name: App bauen
        run: |
          # App-Icon (.icns) aus dem 1024er PNG erzeugen
          ICONSET=iconbuild/AppIcon.iconset
          mkdir -p "$ICONSET"
          for sz in 16 32 128 256 512; do
            sips -z $sz $sz mpc_mapper/assets/icon.png --out "$ICONSET/icon_${sz}x${sz}.png" >/dev/null
            sips -z $((sz*2)) $((sz*2)) mpc_mapper/assets/icon.png --out "$ICONSET/icon_${sz}x${sz}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o iconbuild/AppIcon.icns
          # mido lädt seinen MIDI-Treiber (rtmidi) erst zur Laufzeit per Name
          pyinstaller \
            --noconfirm --clean --log-level WARN \
            --windowed \
            --icon iconbuild/AppIcon.icns \
            --name "MPC Mapper" \
            --osx-bundle-identifier "com.mpcmapper.app" \
            --paths "$GITHUB_WORKSPACE" \
            --hidden-import mido.backends.rtmidi \
            --hidden-import rtmidi \
            --add-data "ma3_plugin:ma3_plugin" \
            --add-data "mappings:mappings" \
            --add-data "mpc_mapper/assets:mpc_mapper/assets" \
            packaging/launcher.py

      - name: Fertige App starten (Selbsttest)
        run: |
          APP="dist/MPC Mapper.app"
          find "$APP" -name "*rtmidi*" | grep -q . || { echo "rtmidi fehlt im Bundle"; exit 1; }
          codesign --verify --deep "$APP"
          # Startet die gebaute App, die sich nach 5 s selbst schließt.
          # Jeder Fehler beim Start lässt diesen Schritt fehlschlagen.
          export MPC_MAPPER_SELFTEST="$PWD/selftest.log"
          rc=0
          perl -e 'alarm 90; exec @ARGV' "$APP/Contents/MacOS/MPC Mapper" > selftest-stdout.log 2>&1 || rc=$?
          echo "exit code $rc" >> selftest-stdout.log
          echo "--- selftest.log (exit code $rc) ---"; cat selftest.log 2>/dev/null || echo "(kein Log)"
          echo "--- stdout/stderr ---"; tail -50 selftest-stdout.log
          [ "$rc" = 0 ] && grep -q '^ok' selftest.log

      - name: Programm-Test (Fenster öffnen + Screenshots)
        run: |
          # Schlägt fehl, wenn das Programm beim Start einen Fehler hat
          mkdir -p shots
          set -o pipefail
          python packaging/screenshots.py shots 2>&1 | tee shots/log.txt

      - name: Screenshot vom Mac-Bildschirm
        if: matrix.arch == 'apple-silicon'
        continue-on-error: true
        run: |
          # Die gebaute App, wie sie auf dem Mac-Bildschirm erscheint
          open "dist/MPC Mapper.app"
          sleep 20
          screencapture -x shots/bildschirm.png || true
          pkill -f "MPC Mapper.app" || true

      - name: Screenshots und Test-Protokoll in den Zweig "screenshots" legen
        if: always() && matrix.arch == 'apple-silicon'
        continue-on-error: true
        run: |
          mkdir -p shots
          cp selftest.log shots/selftest.log 2>/dev/null || true
          cp selftest-stdout.log shots/selftest-stdout.log 2>/dev/null || true
          cd shots
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "macOS-Screenshots vom Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots

      - name: Paket zusammenstellen
        run: |
          OUT="MPC Mapper"
          P="$OUT/grandMA3-Plugin"
          mkdir -p "$P/gma3_library/datapools/plugins"
          cp ma3_plugin/APC_Feedback.xml ma3_plugin/APC_Feedback.lua "$P/gma3_library/datapools/plugins/"
          cp packaging/LIESMICH.txt "$P/"
          cp packaging/Anleitung.html "$OUT/"
          cp mappings/demo.json "$OUT/Demo-Layout.json"
          # ditto erhält Symlinks und Rechte im .app-Paket (normales zip zerstört sie)
          ditto "dist/MPC Mapper.app" "$OUT/MPC Mapper.app"
          ditto -c -k --keepParent "$OUT" "MPC-Mapper-macOS-${{ matrix.arch }}.zip"
          # Einzeldateien für die Release-Seite
          ditto -c -k --keepParent "$P" grandMA3-Plugin.zip
          cp packaging/Anleitung.html mappings/demo.json .
          mv demo.json Demo-Layout.json

      - uses: actions/upload-artifact@v4
        with:
          name: MPC-Mapper-macOS-${{ matrix.arch }}
          path: MPC-Mapper-macOS-${{ matrix.arch }}.zip

      - name: Release aktualisieren
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source packaging/release.sh
          gh release upload "$TAG" "MPC-Mapper-macOS-${{ matrix.arch }}.zip" --clobber
          if [ "${{ matrix.arch }}" = "apple-silicon" ]; then
            gh release upload "$TAG" grandMA3-Plugin.zip Anleitung.html Demo-Layout.json --clobber
          fi

  # ------------------------------------------------------------------------- #
  windows:
    runs-on: windows-latest
    name: Windows 10/11

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.0"

      - name: Programm bauen
        run: |
          # Windows nutzt den eingebauten WinMM-MIDI-Treiber (mpc_mapper/winmm.py)
          pyinstaller \
            --noconfirm --clean --log-level WARN \
            --windowed \
            --icon mpc_mapper/assets/icon.ico \
            --name "MPC Mapper" \
            --paths "$GITHUB_WORKSPACE" \
            --hidden-import mpc_mapper.winmm \
            --add-data "ma3_plugin;ma3_plugin" \
            --add-data "mappings;mappings" \
            --add-data "mpc_mapper/assets;mpc_mapper/assets" \
            packaging/launcher.py

      - name: Fertiges Programm starten (Selbsttest)
        shell: pwsh
        run: |
          # Startet die gebaute .exe, die sich nach 5 s selbst schließt.
          # Jeder Fehler beim Start lässt diesen Schritt fehlschlagen.
          if (-not (Test-Path "dist\MPC Mapper\MPC Mapper.exe")) { throw "MPC Mapper.exe fehlt" }
          $env:MPC_MAPPER_SELFTEST = "$PWD\selftest.log"
          $p = Start-Process -FilePath "dist\MPC Mapper\MPC Mapper.exe" -PassThru
          if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; throw "Programm hängt (vermutlich Fehlerdialog)" }
          Write-Output "--- selftest.log (exit code $($p.ExitCode)) ---"
          if (Test-Path selftest.log) { Get-Content selftest.log } else { Write-Output "(kein Log)" }
          if ($p.ExitCode -ne 0) { throw "Programm mit Fehler beendet" }
          if (-not (Select-String -Path selftest.log -Pattern '^ok' -Quiet)) { throw "Selbsttest nicht bestanden" }

      - name: Programm-Test (Fenster öffnen + Screenshots)
        run: |
          # Schlägt fehl, wenn das Programm beim Start einen Fehler hat
          mkdir -p shots
          set -o pipefail
          python packaging/screenshots.py shots 2>&1 | tee shots/log.txt

      - name: Screenshots und Test-Protokoll in den Zweig "screenshots-windows" legen
        if: always()
        continue-on-error: true
        run: |
          mkdir -p shots
          cp selftest.log shots/selftest.log 2>/dev/null || true
          cd shots
          git init -q -b screenshots-windows
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Windows-Screenshots vom Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots-windows

      - name: Paket zusammenstellen
        run: |
          # Programm (MPC Mapper.exe + _internal) direkt in die oberste Ebene,
          # damit man die .exe sofort findet
          OUT="MPC Mapper"
          mkdir -p "$OUT"
          cp -r "dist/MPC Mapper/." "$OUT/"
          P="$OUT/grandMA3-Plugin"
          mkdir -p "$P/gma3_library/datapools/plugins"
          cp ma3_plugin/APC_Feedback.xml ma3_plugin/APC_Feedback.lua "$P/gma3_library/datapools/plugins/"
          cp packaging/LIESMICH.txt "$P/"
          cp packaging/Anleitung.html "$OUT/"
          cp mappings/demo.json "$OUT/Demo-Layout.json"
          7z a -tzip -mx=7 MPC-Mapper-Windows.zip "$OUT" > /dev/null
          7z l MPC-Mapper-Windows.zip | tail -3

      - uses: actions/upload-artifact@v4
        with:
          name: MPC-Mapper-Windows
          path: MPC-Mapper-Windows.zip

      - name: Release aktualisieren
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source packaging/release.sh
          gh release upload "$TAG" MPC-Mapper-Windows.zip --clobber
