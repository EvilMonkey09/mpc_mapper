# Baut MPC Mapper für macOS (Apple Silicon + Intel) und Windows 10/11 auf GitHub-Servern.
#
# Ergebnis: Windows-Installer (MPC-Mapper-Setup-Windows.exe) und macOS-Disk-Images (.dmg).
# Herunterladen: Reiter "Actions" → letzter Lauf → unten "Artifacts".
# Ein Push auf den Zweig "release" (oder ein Tag "v*") erstellt bzw. aktualisiert
# zusätzlich das Release mit allen Dateien.

name: App bauen (macOS + Windows)

on:
  workflow_dispatch:          # Button "Run workflow" im Reiter Actions
  push:
    branches: [release, xtouch]   # Push auf "release" = Release aktualisieren
    tags: ["v*"]

concurrency:
  # a newer push on the same branch cancels the older, still running build
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write             # nötig für Releases

env:
  # Versionsnummer für Pushes auf den Zweig "release" – hier hochzählen
  RELEASE_VERSION: v2.1
  # Testversion aus dem Zweig "xtouch" (als Vorabversion veröffentlicht)
  BETA_VERSION: v2.0-beta
  PYTHON_VERSION: "3.12"

defaults:
  run:
    shell: bash

jobs:
  # ------------------------------------------------------------------------- #
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26           # Apple Silicon (M1/M2/M3/M4)
            arch: apple-silicon
          - runner: macos-15-intel     # ältere Macs mit Intel-Prozessor
            arch: intel
    runs-on: ${{ matrix.runner }}
    name: macOS (${{ matrix.arch }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.0" pytest

      - name: Automatische Tests (ohne Hardware)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # Bei Fehlern die Ausgabe als Hinweis (Annotation) an den Lauf hängen
          python -m pytest -q --tb=short -p no:cacheprovider tests > pytest.log 2>&1 && rc=0 || rc=$?
          cat pytest.log
          if [ $rc != 0 ]; then
            msg=$(tail -c 3500 pytest.log | python -c "import sys; print(sys.stdin.read().replace('%','%25').replace('\r','').replace('\n','%0A'))")
            echo "::error title=pytest::$msg"
          fi
          exit $rc

      - name: App bauen
        run: |
          # App-Icon (.icns) aus dem 1024er PNG erzeugen
          ICONSET=iconbuild/AppIcon.iconset
          mkdir -p "$ICONSET"
          for sz in 16 32 128 256 512; do
            sips -z $sz $sz mpc_mapper/assets/icon.png --out "$ICONSET/icon_${sz}x${sz}.png" >/dev/null
            sips -z $((sz*2)) $((sz*2)) mpc_mapper/assets/icon.png --out "$ICONSET/icon_${sz}x${sz}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o iconbuild/AppIcon.icns
          # mido lädt seinen MIDI-Treiber (rtmidi) erst zur Laufzeit per Name
          pyinstaller \
            --noconfirm --clean --log-level WARN \
            --windowed \
            --icon iconbuild/AppIcon.icns \
            --name "MPC Mapper" \
            --osx-bundle-identifier "com.mpcmapper.app" \
            --paths "$GITHUB_WORKSPACE" \
            --hidden-import mido.backends.rtmidi \
            --hidden-import rtmidi \
            --add-data "ma3_plugin:ma3_plugin" \
            --add-data "mappings:mappings" \
            --add-data "mpc_mapper/assets:mpc_mapper/assets" \
            packaging/launcher.py

      - name: Fertige App starten (Selbsttest)
        run: |
          APP="dist/MPC Mapper.app"
          find "$APP" -name "*rtmidi*" | grep -q . || { echo "rtmidi fehlt im Bundle"; exit 1; }
          codesign --verify --deep "$APP"
          # Startet die gebaute App, die sich nach 5 s selbst schließt.
          # Jeder Fehler beim Start lässt diesen Schritt fehlschlagen.
          export MPC_MAPPER_SELFTEST="$PWD/selftest.log"
          rm -f selftest.log
          rc=0
          perl -e 'alarm 90; exec @ARGV' "$APP/Contents/MacOS/MPC Mapper" "--selftest=$MPC_MAPPER_SELFTEST" > selftest-stdout.log 2>&1 || rc=$?
          echo "exit code $rc" >> selftest-stdout.log
          echo "--- selftest.log (exit code $rc) ---"; cat selftest.log 2>/dev/null || echo "(kein Log)"
          echo "--- stdout/stderr ---"; tail -50 selftest-stdout.log
          [ "$rc" = 0 ] && grep -q '^ok' selftest.log

      - name: DMG bauen
        run: |
          # Inhalt des Disk-Images: App, Verknüpfung "Programme" zum Hineinziehen,
          # Plugin fürs Pult, Anleitung und Demo-Layout
          STAGE="dmg/MPC Mapper"
          P="$STAGE/grandMA3-Plugin"
          mkdir -p "$P/gma3_library/datapools/plugins"
          ditto "dist/MPC Mapper.app" "$STAGE/MPC Mapper.app"
          ln -s /Applications "$STAGE/Programme"
          cp ma3_plugin/APC_Feedback.xml ma3_plugin/APC_Feedback.lua "$P/gma3_library/datapools/plugins/"
          cp packaging/LIESMICH.txt "$P/"
          cp packaging/Anleitung.html "$STAGE/"
          cp mappings/demo.json "$STAGE/Demo-Layout.json"
          DMG="MPC-Mapper-macOS-${{ matrix.arch }}.dmg"
          # hdiutil meldet auf den Servern gelegentlich "Resource busy" – dann neu versuchen
          for i in 1 2 3 4 5; do
            hdiutil create -volname "MPC Mapper" -srcfolder "$STAGE" -ov -format UDZO "$DMG" && break
            echo "hdiutil fehlgeschlagen, Versuch $i"; sleep 10
          done
          # Prüfen: DMG einhängen, App darin vorhanden und gültig
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG"
          ls -la "$MNT"
          test -x "$MNT/MPC Mapper.app/Contents/MacOS/MPC Mapper"
          test -L "$MNT/Programme"
          test -f "$MNT/grandMA3-Plugin/gma3_library/datapools/plugins/APC_Feedback.lua"
          codesign --verify --deep "$MNT/MPC Mapper.app"
          hdiutil detach "$MNT"
          ls -lh "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: MPC-Mapper-macOS-${{ matrix.arch }}
          path: MPC-Mapper-macOS-${{ matrix.arch }}.dmg

      - name: Release aktualisieren
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release' || github.ref == 'refs/heads/xtouch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source packaging/release.sh
          gh release upload "$TAG" "MPC-Mapper-macOS-${{ matrix.arch }}.dmg" --clobber
          # alte ZIP-Pakete früherer Builds entfernen
          gh release delete-asset "$TAG" "MPC-Mapper-macOS-${{ matrix.arch }}.zip" -y 2>/dev/null || true

  # ------------------------------------------------------------------------- #
  windows:
    runs-on: windows-latest
    name: Windows 10/11

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.0" pytest

      - name: Automatische Tests (ohne Hardware)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # Bei Fehlern die Ausgabe als Hinweis (Annotation) an den Lauf hängen
          python -m pytest -q --tb=short -p no:cacheprovider tests > pytest.log 2>&1 && rc=0 || rc=$?
          cat pytest.log
          if [ $rc != 0 ]; then
            msg=$(tail -c 3500 pytest.log | python -c "import sys; print(sys.stdin.read().replace('%','%25').replace('\r','').replace('\n','%0A'))")
            echo "::error title=pytest::$msg"
          fi
          exit $rc

      - name: Programm bauen
        run: |
          # Windows nutzt den eingebauten WinMM-MIDI-Treiber (mpc_mapper/winmm.py)
          pyinstaller \
            --noconfirm --clean --log-level WARN \
            --windowed \
            --icon mpc_mapper/assets/icon.ico \
            --name "MPC Mapper" \
            --paths "$GITHUB_WORKSPACE" \
            --hidden-import mpc_mapper.winmm \
            --add-data "ma3_plugin;ma3_plugin" \
            --add-data "mappings;mappings" \
            --add-data "mpc_mapper/assets;mpc_mapper/assets" \
            packaging/launcher.py

      - name: Fertiges Programm starten (Selbsttest)
        shell: pwsh
        run: |
          # Startet die gebaute .exe, die sich nach 5 s selbst schließt.
          # Jeder Fehler beim Start lässt diesen Schritt fehlschlagen.
          if (-not (Test-Path "dist\MPC Mapper\MPC Mapper.exe")) { throw "MPC Mapper.exe fehlt" }
          $env:MPC_MAPPER_SELFTEST = "$PWD\selftest.log"
          $p = Start-Process -FilePath "dist\MPC Mapper\MPC Mapper.exe" -PassThru
          if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; throw "Programm hängt (vermutlich Fehlerdialog)" }
          Write-Output "--- selftest.log (exit code $($p.ExitCode)) ---"
          if (Test-Path selftest.log) { Get-Content selftest.log } else { Write-Output "(kein Log)" }
          if ($p.ExitCode -ne 0) { throw "Programm mit Fehler beendet" }
          if (-not (Select-String -Path selftest.log -Pattern '^ok' -Quiet)) { throw "Selbsttest nicht bestanden" }

      - name: Installer bauen (Setup.exe)
        run: |
          # Plugin-Ordner für den Installer bereitlegen
          P="pkg/grandMA3-Plugin"
          mkdir -p "$P/gma3_library/datapools/plugins"
          cp ma3_plugin/APC_Feedback.xml ma3_plugin/APC_Feedback.lua "$P/gma3_library/datapools/plugins/"
          cp packaging/LIESMICH.txt "$P/"
          # Versionsnummer
          case "$GITHUB_REF" in
            refs/tags/*)          VER="$GITHUB_REF_NAME" ;;
            refs/heads/release)   VER="$RELEASE_VERSION" ;;
            refs/heads/xtouch)    VER="$BETA_VERSION" ;;
            *)                    VER="dev-${GITHUB_SHA::7}" ;;
          esac
          VER="${VER#v}"
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          # Einzeldateien für die Release-Seite
          (cd pkg && 7z a -tzip ../grandMA3-Plugin.zip grandMA3-Plugin > /dev/null)
          cp packaging/Anleitung.html Anleitung.html
          cp mappings/demo.json Demo-Layout.json

      - name: Setup.exe kompilieren (Inno Setup)
        shell: pwsh
        run: |
          # In PowerShell, weil die Bash Argumente wie /DAppVersion als Pfad umschreibt
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { Write-Output "::error title=Inno Setup::ISCC.exe nicht gefunden"; exit 1 }
          $out = & $iscc "/DAppVersion=$env:APP_VERSION" "/DSrcRoot=$env:GITHUB_WORKSPACE" "packaging\windows\installer.iss" 2>&1
          $rc = $LASTEXITCODE
          $out | Write-Output
          if ($rc -ne 0) {
            $msg = (($out | Select-Object -Last 25) -join "%0A")
            Write-Output "::error title=Inno Setup::$msg"
            exit $rc
          }
          Get-Item MPC-Mapper-Setup-Windows.exe | Format-List Name,Length

      - name: Installer testen (still installieren, starten, deinstallieren)
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\MPC Mapper Test"
          $p = Start-Process -FilePath ".\MPC-Mapper-Setup-Windows.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=`"$dir`"" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Setup mit Fehler $($p.ExitCode) beendet" }
          foreach ($f in "MPC Mapper.exe","Anleitung.html","Demo-Layout.json","grandMA3-Plugin\gma3_library\datapools\plugins\APC_Feedback.lua","unins000.exe") {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "$f fehlt nach der Installation" }
          }
          $log = "$PWD\installed-selftest.log"
          $a = Start-Process -FilePath (Join-Path $dir "MPC Mapper.exe") -ArgumentList "--selftest=$log" -PassThru
          if (-not $a.WaitForExit(90000)) { Stop-Process -Id $a.Id -Force; throw "Installiertes Programm hängt" }
          Get-Content $log
          if (-not (Select-String -Path $log -Pattern '^ok' -Quiet)) { throw "Selbsttest des installierten Programms nicht bestanden" }
          $u = Start-Process -FilePath (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru -Wait
          Write-Output "Deinstallation: exit code $($u.ExitCode)"

      - uses: actions/upload-artifact@v4
        with:
          name: MPC-Mapper-Windows
          path: MPC-Mapper-Setup-Windows.exe

      - name: Release aktualisieren
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release' || github.ref == 'refs/heads/xtouch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source packaging/release.sh
          gh release upload "$TAG" MPC-Mapper-Setup-Windows.exe --clobber
          # alte ZIP-Pakete früherer Builds entfernen
          gh release delete-asset "$TAG" MPC-Mapper-Windows.zip -y 2>/dev/null || true
          # Einzeldateien (Plugin, Anleitung, Demo) für die Release-Seite
          gh release upload "$TAG" grandMA3-Plugin.zip Anleitung.html Demo-Layout.json --clobber
